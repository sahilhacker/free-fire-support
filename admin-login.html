<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login - Free Fire Support</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .login-card {
      max-width: 450px;
      margin: 80px auto;
      padding: 35px;
      background: #101010;
      border: 1px solid #292929;
      border-radius: 12px;
      text-align: center;
    }

    .login-card h1 {
      margin-bottom: 12px;
    }

    .login-card p {
      color: #888;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .google-btn {
      width: 100%;
      padding: 14px;
      border: 1px solid #444;
      border-radius: 7px;
      background: #fff;
      color: #111;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .google-btn:hover {
      opacity: .9;
    }

    #loginMessage {
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header class="header">
  <div class="logo">
    FREE FIRE <span>SUPPORT</span>
  </div>

  <a href="index.html" class="telegram">
    Website
  </a>
</header>

<main class="form-page">

  <div class="login-card">

    <div class="badge">ADMIN AREA</div>

    <h1>Admin <span>Login</span></h1>

    <p>
      Sign in with the authorized Google account to access
      ticket management.
    </p>

    <button id="googleLogin" class="google-btn">
      Continue with Google
    </button>

    <div id="loginMessage"></div>

  </div>

</main>

<script type="module" src="admin-login.js"></script>

</body>
</html>
